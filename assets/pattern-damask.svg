<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <g fill="none" stroke="#c9a84c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <!-- ===== Central damask flourish (mirrored about x=70) ===== -->
    <!-- top leaf -->
    <path d="M70 30 C 62 42 62 54 70 62 C 78 54 78 42 70 30 Z"/>
    <!-- upper side scrolls -->
    <path d="M70 62 C 53 60 41 49 44 33 C 56 38 66 47 70 62"/>
    <path d="M70 62 C 87 60 99 49 96 33 C 84 38 74 47 70 62"/>
    <!-- lower side scrolls -->
    <path d="M70 78 C 53 80 41 91 44 107 C 56 102 66 93 70 78"/>
    <path d="M70 78 C 87 80 99 91 96 107 C 84 102 74 93 70 78"/>
    <!-- bottom leaf -->
    <path d="M70 110 C 62 98 62 86 70 78 C 78 86 78 98 70 110 Z"/>
    <!-- center medallion -->
    <circle cx="70" cy="70" r="6"/>
    <circle cx="70" cy="70" r="2.4" fill="#c9a84c" stroke="none"/>
    <!-- small accent buds -->
    <circle cx="70" cy="24" r="1.6" fill="#c9a84c" stroke="none"/>
    <circle cx="70" cy="116" r="1.6" fill="#c9a84c" stroke="none"/>

    <!-- ===== Corner quarter-flourishes (meet across tiles to form full motifs) ===== -->
    <!-- top-left -->
    <path d="M0 18 C 12 16 18 10 16 -2"/>
    <path d="M18 0 C 16 12 10 18 -2 16"/>
    <circle cx="0" cy="0" r="2" fill="#c9a84c" stroke="none"/>
    <!-- top-right -->
    <path d="M140 18 C 128 16 122 10 124 -2"/>
    <path d="M122 0 C 124 12 130 18 142 16"/>
    <circle cx="140" cy="0" r="2" fill="#c9a84c" stroke="none"/>
    <!-- bottom-left -->
    <path d="M0 122 C 12 124 18 130 16 142"/>
    <path d="M18 140 C 16 128 10 122 -2 124"/>
    <circle cx="0" cy="140" r="2" fill="#c9a84c" stroke="none"/>
    <!-- bottom-right -->
    <path d="M140 122 C 128 124 122 130 124 142"/>
    <path d="M122 140 C 124 128 130 122 142 124"/>
    <circle cx="140" cy="140" r="2" fill="#c9a84c" stroke="none"/>
  </g>
</svg>
